[package]
name = "webgal-language-server"
version = "0.2.0"
edition.workspace = true
readme.workspace = true
description = "WebGAL 语言服务器封装"

authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["simulate-diagnose"]
simulate-diagnose = ["webgal-language-service/simulate-diagnose"] # 基于模拟执行的代码诊断

[dependencies]
path-tree.workspace = true

webgal-language-core.workspace = true
webgal-language-service.workspace = true

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow.workspace = true

getset.workspace = true
derive_more.workspace = true
strum.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive"] }

rayon.workspace = true
percent-encoding.workspace = true

tower-lsp.workspace = true
async-trait = "0.1"
futures-util.workspace = true
async-tungstenite.workspace = true
ws_stream_tungstenite.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-std",
    "io-util",
    "net",
] }
tokio-util.workspace = true
