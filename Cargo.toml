[workspace]
resolver = "2"
members = ["crates/*", "editor/src-tauri"]

[workspace.package]
edition = "2024"
readme = "README.md"

authors = ["fltLi"]
license = "MPL-2.0"
repository = "https://github.com/fltLi/webgal-lsp"

[workspace.dependencies]
count.path = "./crates/count"
path-tree.path = "./crates/path-tree"
json-language-service.path = "./crates/json-language-service"

webgal-language-core.path = "./crates/webgal-language-core"
webgal-language-service.path = "./crates/webgal-language-service"
webgal-language-server.path = "./crates/webgal-language-server"
webgal-simulate.path = "./crates/webgal-simulate"
webgal-sentence-macro.path = "./crates/webgal-sentence-macro"     # private
webgal-snapshot.path = "./crates/webgal-snapshot"

anyhow = "1.0"
thiserror = "2.0"

ouroboros = "0.18"
getset = "0.1.7"
derive_more = { version = "2.1", features = [
    "from",
    "into",
    "try_into",
    "into_iterator",
    "deref",
    "deref_mut",
] }
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.20"
serde_json = "1.0"

either = "1.16"
itertools = "0.14"
once_cell = "1.21"
rayon = "1.12"
rand = "0.10"
percent-encoding = "2.3"
clap = { version = "4.6", features = ["derive"] }

tower = "=0.4.13"
tower-http = "=0.5.2"
tower-lsp = "=0.20.0"
lsp-types = "=0.94.1"
futures-util = "0.3"
async-tungstenite = "0.28"
ws_stream_tungstenite = { version = "0.14", features = ["tokio_io"] }
tokio = "1.53"
tokio-util = { version = "0.7", features = ["compat"] }

criterion = { version = "0.8", features = ["html_reports"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
