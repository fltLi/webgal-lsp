# 统一管理仓库里零散分布的 Python 脚本的静态检查与格式化.
# 工具与命令见 AGENTS.md 第 2 节; CI 的 python job 只跑这里的配置.

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["scripts", "crates/webgal-language-service/scripts"]
exclude = [
  "**/__pycache__",
  "**/node_modules",
  "**/.svelte-kit",
  "**/target",
  "**/dist",
  "**/pkg",
  "build",
]

[tool.black]
target-version = ["py312"]
line-length = 88
