<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 起点位于中心偏下 (100,120) -->

  <!-- 三片花瓣：近三角形，边缘微弧，末端尖角，基部平直 -->
  <g fill="#2DD4BF">
    <!-- 正东方向 -->
    <path d="M100,113 C118,113 142,116 158,121 C159,122 159,124 158,125 C142,129 118,130 100,127 L100,113 Z"/>
    <!-- 北偏西 60° -->
    <path d="M100,113 C118,113 142,116 158,121 C159,122 159,124 158,125 C142,129 118,130 100,127 L100,113 Z" transform="rotate(210,100,120)"/>
    <!-- 南偏西 45° -->
    <path d="M100,113 C118,113 142,116 158,121 C159,122 159,124 158,125 C142,129 118,130 100,127 L100,113 Z" transform="rotate(135,100,120)"/>
  </g>

  <!-- 较短花蕊：正北轻微偏西 -->
  <g transform="rotate(-10,100,120)">
    <!-- 花蕊茎 -->
    <path d="M100,120 C99,105 98.5,92 98,82 L102,82 C101.5,92 101,105 100,120 Z" fill="#14B8A6"/>
    <!-- 花药头：扁椭圆，扁平填充 -->
    <ellipse cx="100" cy="80" rx="5" ry="3" fill="#0F766E"/>
  </g>

  <!-- 较长花蕊：北偏东 30° -->
  <g transform="rotate(30,100,120)">
    <!-- 花蕊茎 -->
    <path d="M100,120 C99,100 98.5,77 98,59 L102,59 C101.5,77 101,100 100,120 Z" fill="#14B8A6"/>
    <!-- 花药头：扁椭圆，扁平填充 -->
    <ellipse cx="100" cy="56" rx="6" ry="3.5" fill="#0F766E"/>
  </g>
</svg>
