# This file is generated by AI.

name: Source Composition

# 手动触发: 生成源码构成 HTML 画像并上传为工作流产物.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Build HTML report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate composition report
        run: python scripts/source-composition.py --output source-composition.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-composition
          path: source-composition.html
          if-no-files-found: error
