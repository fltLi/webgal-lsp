# This file is generated by AI.

name: Deploy Playground

on:
  push:
    branches: ["main"]
    # 只在真正影响 Playground 的改动上重建: 它自己, 以及它 file: 依赖的 wasm 依赖链
    paths:
      - 'packages/webgal-parse-playground/**'
      - 'crates/webgal-language-service/**'
      - 'crates/webgal-language-core/**'
      - 'crates/webgal-sentence-macro/**'
      - 'crates/webgal-simulate/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build playground
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build wasm package
        working-directory: packages/webgal-parse-playground
        run: bun run build:wasm

      # 必须在 build:wasm 之后: 该包以 file: 依赖 crates/webgal-language-service/pkg
      - name: Install dependencies
        working-directory: packages/webgal-parse-playground
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: packages/webgal-parse-playground
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/webgal-parse-playground/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
