name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号, 不带 v 前缀 (例如 0.4.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os-label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os-label: linux-x86_64
            editor-bundles: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os-label: windows-x86_64
            editor-bundles: nsis
          - os: macos-latest
            target: x86_64-apple-darwin
            os-label: macos-x86_64
            editor-bundles: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            os-label: macos-aarch64
            editor-bundles: dmg

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      # 版本号只有一个来源: 发行 tag (发版) 或手动输入 (workflow_dispatch), 并做一次格式校验,
      # 免得算出一个 "main" 这样的版本号还一路写进产物名
      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号 '$VERSION' 不合法, 期望形如 0.4.0"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "版本号: $VERSION"

      - name: Install editor dependencies
        working-directory: editor
        run: bun install --frozen-lockfile

      # 两个 CLI 一次编完: 同一条命令复用同一份依赖图与 target/
      - name: Build CLI binaries
        run: cargo build -p webgal-language-server -p webgal-snapshot --target ${{ matrix.target }} --release

      - name: Package CLI binaries
        shell: bash
        run: |
          set -euo pipefail
          for name in webgal-language-server webgal-snapshot; do
            bin="$name"
            if [ "$RUNNER_OS" = "Windows" ]; then
              bin="$name.exe"
            fi
            cp "target/${{ matrix.target }}/release/$bin" "./$bin"

            if [ "$RUNNER_OS" = "Windows" ]; then
              archive="$name-${{ env.VERSION }}-${{ matrix.os-label }}.zip"
              7z a "$archive" "$bin" > /dev/null
            else
              chmod +x "$bin"
              archive="$name-${{ env.VERSION }}-${{ matrix.os-label }}.tar.gz"
              tar czf "$archive" "$bin"
            fi
            echo "打包: $archive"
          done
          ls -lh ./*.zip ./*.tar.gz 2>/dev/null || true

      - name: Build editor
        shell: bash
        working-directory: editor
        run: |
          set -euo pipefail
          # 用文件而不是命令行内联 JSON: 免得在各种 shell 里跟引号打架
          CONF="$RUNNER_TEMP/tauri.release.conf.json"
          printf '{"version":"%s"}\n' "${{ env.VERSION }}" > "$CONF"
          cat "$CONF"
          bun run tauri -- build --ci \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.editor-bundles }} \
            --config "$CONF"

      - name: Package editor installer
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/bundle"

          case "${{ matrix.editor-bundles }}" in
            nsis)     SUBDIR="nsis";     PATTERN='*.exe' ;;
            dmg)      SUBDIR="dmg";      PATTERN='*.dmg' ;;
            appimage) SUBDIR="appimage"; PATTERN='*.AppImage' ;;
            *)        echo "::error::未知的 bundle 类型"; exit 1 ;;
          esac

          INSTALLER=$(find "$BUNDLE_ROOT/$SUBDIR" -maxdepth 1 -type f -name "$PATTERN" -print -quit)
          if [ -z "$INSTALLER" ]; then
            echo "::error::未找到编辑器安装包"
            find "$BUNDLE_ROOT" -maxdepth 3 -type f 2>/dev/null || true
            exit 1
          fi
          echo "找到安装包: $INSTALLER"

          if [ "${{ matrix.editor-bundles }}" = "appimage" ]; then
            ARCHIVE="editor-${{ env.VERSION }}-${{ matrix.os-label }}.tar.gz"
            tar czf "$ARCHIVE" -C "$(dirname "$INSTALLER")" "$(basename "$INSTALLER")"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            ARCHIVE="editor-${{ env.VERSION }}-${{ matrix.os-label }}.zip"
            7z a "$ARCHIVE" "$INSTALLER" > /dev/null
          else
            ARCHIVE="editor-${{ env.VERSION }}-${{ matrix.os-label }}.zip"
            (cd "$(dirname "$INSTALLER")" && zip -r "$GITHUB_WORKSPACE/$ARCHIVE" "$(basename "$INSTALLER")")
          fi
          ls -lh "$ARCHIVE"

      # 手动触发时也要能拿到产物, 所以先统一上传 artifact
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os-label }}-binaries
          path: |
            ./*.zip
            ./*.tar.gz
          if-no-files-found: error

  # 发版时把所有平台的产物一次性挂到 Release 上; 手动触发只留 artifact
  publish:
    name: Publish release assets
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
