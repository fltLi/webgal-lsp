name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os-label: linux-x86_64
            editor-bundles: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os-label: windows-x86_64
            editor-bundles: nsis
          - os: macos-latest
            target: x86_64-apple-darwin
            os-label: macos-x86_64
            editor-bundles: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            os-label: macos-aarch64
            editor-bundles: dmg

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Ensure tauri CLI platform binary
        if: runner.os != 'macOS'
        run: npm install @tauri-apps/cli@2
        working-directory: editor

      - name: Set version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.1.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build server binary
        run: cargo build -p webgal-language-server --target ${{ matrix.target }} --release

      - name: Package server binary
        shell: bash
        run: |
          BIN_NAME="webgal-language-server"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_NAME="webgal-language-server.exe"
          fi
          SRC="target/${{ matrix.target }}/release/$BIN_NAME"
          DST="./$BIN_NAME"
          cp "$SRC" "$DST"

          if [ "${{ runner.os }}" = "Windows" ]; then
            ARCHIVE="server-${{ env.VERSION }}-${{ matrix.os-label }}.zip"
            7z a "$ARCHIVE" "$DST"
          else
            chmod +x "$DST"
            ARCHIVE="server-${{ env.VERSION }}-${{ matrix.os-label }}.tar.gz"
            tar czf "$ARCHIVE" "$DST"
          fi
          echo "SERVER_ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Build snapshot binary
        run: cargo build -p webgal-snapshot --target ${{ matrix.target }} --release

      - name: Package snapshot binary
        shell: bash
        run: |
          BIN_NAME="webgal-snapshot"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_NAME="webgal-snapshot.exe"
          fi
          SRC="target/${{ matrix.target }}/release/$BIN_NAME"
          DST="./$BIN_NAME"
          cp "$SRC" "$DST"

          if [ "${{ runner.os }}" = "Windows" ]; then
            ARCHIVE="snapshot-${{ env.VERSION }}-${{ matrix.os-label }}.zip"
            7z a "$ARCHIVE" "$DST"
          else
            chmod +x "$DST"
            ARCHIVE="snapshot-${{ env.VERSION }}-${{ matrix.os-label }}.tar.gz"
            tar czf "$ARCHIVE" "$DST"
          fi
          echo "SNAPSHOT_ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Build editor installers
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cd editor
          npx tauri build --ci \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.editor-bundles }} \
            --config "{\"version\":\"${{ env.VERSION }}\"}"

          BUNDLE_ROOT="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/bundle"
          echo "Bundle root: $BUNDLE_ROOT"
          ls -R "$BUNDLE_ROOT" || true

          case "${{ matrix.editor-bundles }}" in
            nsis)
              INSTALLER=$(find "$BUNDLE_ROOT/nsis" -maxdepth 1 -name '*.exe' | head -n1)
              EXT="exe"
              ;;
            dmg)
              INSTALLER=$(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -name '*.dmg' | head -n1)
              EXT="dmg"
              ;;
            appimage)
              INSTALLER=$(find "$BUNDLE_ROOT/appimage" -maxdepth 1 -name '*.AppImage' | head -n1)
              EXT="AppImage"
              ;;
          esac

          if [ -z "$INSTALLER" ]; then
            echo "未找到编辑器安装包，bundle 目录内容:"
            find "$BUNDLE_ROOT" -maxdepth 2 -type f 2>/dev/null || true
            exit 1
          fi

          DST="editor-${{ env.VERSION }}-${{ matrix.os-label }}.$EXT"
          cp "$INSTALLER" "$GITHUB_WORKSPACE/$DST"
          echo "EDITOR_INSTALLER=$DST" >> $GITHUB_ENV
          ls -l "$GITHUB_WORKSPACE/$DST" || true

      - name: Upload server binary to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SERVER_ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot binary to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SNAPSHOT_ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload editor installer to Release (Windows & Linux only)
        if: github.event_name == 'release' && runner.os != 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.EDITOR_INSTALLER }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary artifact (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os-label }}-binaries
          path: |
            ${{ env.SERVER_ARCHIVE }}
            ${{ env.SNAPSHOT_ARCHIVE }}
            ${{ runner.os != 'macOS' && env.EDITOR_INSTALLER || '' }}
