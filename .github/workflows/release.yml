name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os-label: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os-label: windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            os-label: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            os-label: macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/terre-adapter/package-lock.json

      - name: Set version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "VERSION=dev" >> $GITHUB_ENV
          fi

      - name: Build Rust binary
        run: cargo build -p webgal-language-server --target ${{ matrix.target }} --release

      - name: Prepare binary-only package
        shell: bash
        run: |
          BIN_NAME="webgal-language-server"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_NAME="webgal-language-server.exe"
          fi
          SRC="target/${{ matrix.target }}/release/$BIN_NAME"
          DST="./$BIN_NAME"
          cp "$SRC" "$DST"

          if [ "${{ runner.os }}" = "Windows" ]; then
            chmod +x "$DST" 2>/dev/null || true
            ARCHIVE="server-${{ env.VERSION }}-${{ matrix.os-label }}.zip"
            7z a "$ARCHIVE" "$DST"
          else
            chmod +x "$DST"
            ARCHIVE="server-${{ env.VERSION }}-${{ matrix.os-label }}.tar.gz"
            tar czf "$ARCHIVE" "$DST"
          fi
          echo "SERVER_ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Build adapter
        shell: bash
        run: |
          cd packages/terre-adapter
          npm install
          npm run build
          cd -

      - name: Prepare terre-adapter package
        shell: bash
        run: |
          BIN_NAME="webgal-language-server"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_NAME="webgal-language-server.exe"
          fi
          ADAPTER_DIR="webgal-lsp-${{ env.VERSION }}"
          mkdir -p "$ADAPTER_DIR/bin"

          cp packages/terre-adapter/dist/start.js "$ADAPTER_DIR/"
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "$ADAPTER_DIR/bin/$BIN_NAME"
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "$ADAPTER_DIR/bin/$BIN_NAME"
          fi

          ARCHIVE="webgal-lsp-for-terre-${{ env.VERSION }}-${{ matrix.os-label }}.zip"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$ARCHIVE" "$ADAPTER_DIR"
          else
            zip -r "$ARCHIVE" "$ADAPTER_DIR"
          fi
          echo "ADAPTER_ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SERVER_ARCHIVE }}
            ${{ env.ADAPTER_ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary artifact (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os-label }}-binary
          path: ${{ env.SERVER_ARCHIVE }}

      - name: Upload adapter artifact (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os-label }}-adapter
          path: ${{ env.ADAPTER_ARCHIVE }}
