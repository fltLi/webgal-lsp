name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os-label: linux-x86_64
            editor-bundles: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os-label: windows-x86_64
            editor-bundles: nsis
          - os: macos-latest
            target: x86_64-apple-darwin
            os-label: macos-x86_64
            editor-bundles: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            os-label: macos-aarch64
            editor-bundles: dmg

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install editor dependencies
        working-directory: editor
        run: npm install --workspaces=false

      - name: Set version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.1.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ---------------------- server ----------------------
      - name: Build server binary
        run: cargo build -p webgal-language-server --target ${{ matrix.target }} --release

      - name: Package server binary
        shell: bash
        run: |
          BIN_NAME="webgal-language-server"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_NAME="webgal-language-server.exe"
          fi
          SRC="target/${{ matrix.target }}/release/$BIN_NAME"
          DST="./$BIN_NAME"
          cp "$SRC" "$DST"

          if [ "${{ runner.os }}" = "Windows" ]; then
            ARCHIVE="server-${{ env.VERSION }}-${{ matrix.os-label }}.zip"
            7z a "$ARCHIVE" "$DST"
          else
            chmod +x "$DST"
            ARCHIVE="server-${{ env.VERSION }}-${{ matrix.os-label }}.tar.gz"
            tar czf "$ARCHIVE" "$DST"
          fi
          echo "SERVER_ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      # ---------------------- snapshot ----------------------
      - name: Build snapshot binary
        run: cargo build -p webgal-snapshot --target ${{ matrix.target }} --release

      - name: Package snapshot binary
        shell: bash
        run: |
          BIN_NAME="webgal-snapshot"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_NAME="webgal-snapshot.exe"
          fi
          SRC="target/${{ matrix.target }}/release/$BIN_NAME"
          DST="./$BIN_NAME"
          cp "$SRC" "$DST"

          if [ "${{ runner.os }}" = "Windows" ]; then
            ARCHIVE="snapshot-${{ env.VERSION }}-${{ matrix.os-label }}.zip"
            7z a "$ARCHIVE" "$DST"
          else
            chmod +x "$DST"
            ARCHIVE="snapshot-${{ env.VERSION }}-${{ matrix.os-label }}.tar.gz"
            tar czf "$ARCHIVE" "$DST"
          fi
          echo "SNAPSHOT_ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      # ---------------------- editor ----------------------
      - name: Build editor
        shell: bash
        working-directory: editor
        run: |
          npm run tauri build -- --ci \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.editor-bundles }} \
            --config "{\"version\":\"${{ env.VERSION }}\"}"

      - name: Package editor installer
        shell: bash
        run: |
          BUNDLE_ROOT="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/bundle"
          echo "Bundle root: $BUNDLE_ROOT"
          ls -R "$BUNDLE_ROOT" || true

          case "${{ matrix.editor-bundles }}" in
            nsis)
              SUBDIR="nsis"
              PATTERN='*.exe'
              ;;
            dmg)
              SUBDIR="dmg"
              PATTERN='*.dmg'
              ;;
            appimage)
              SUBDIR="appimage"
              PATTERN='*.AppImage'
              ;;
          esac

          INSTALLER=$(find "$BUNDLE_ROOT/$SUBDIR" -maxdepth 1 -type f -name "$PATTERN" | head -n1)

          if [ -z "$INSTALLER" ]; then
            echo "未找到编辑器安装包，bundle 目录内容:"
            find "$BUNDLE_ROOT" -maxdepth 3 -type f 2>/dev/null || true
            exit 1
          fi

          echo "Found installer: $INSTALLER"

          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            ARCHIVE="editor-${{ env.VERSION }}-${{ matrix.os-label }}.tar.gz"
            tar czf "$ARCHIVE" -C "$(dirname "$INSTALLER")" "$(basename "$INSTALLER")"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            ARCHIVE="editor-${{ env.VERSION }}-${{ matrix.os-label }}.zip"
            7z a "$ARCHIVE" "$INSTALLER" >/dev/null
          else
            ARCHIVE="editor-${{ env.VERSION }}-${{ matrix.os-label }}.zip"
            (cd "$(dirname "$INSTALLER")" && zip -r "$GITHUB_WORKSPACE/$ARCHIVE" "$(basename "$INSTALLER")")
          fi

          echo "EDITOR_ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          ls -lh "$ARCHIVE"

      # ---------------------- uploads ----------------------
      - name: Upload server binary to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SERVER_ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot binary to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SNAPSHOT_ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload editor archive to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.EDITOR_ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary artifact (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os-label }}-binaries
          path: |
            ${{ env.SERVER_ARCHIVE }}
            ${{ env.SNAPSHOT_ARCHIVE }}
            ${{ env.EDITOR_ARCHIVE }}
