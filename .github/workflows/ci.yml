# This file is generated by AI.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

# 同一分支上的旧任务直接取消, 省一次全套编译
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rust 侧: clippy 与 test 共享同一个 target/ 缓存, 所以放在一个 job 里跑完
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude webgal-ink -- --deny warnings

      - name: Test
        run: cargo test --workspace --exclude webgal-ink

  # 编辑器前端: 不碰 Rust、不碰 wasm, 一条 install 跑完所有检查
  editor:
    name: Editor (lint + type-check + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        working-directory: editor
        run: bun install --frozen-lockfile

      - name: Check formatting
        working-directory: editor
        run: bun run format-check

      - name: Lint
        working-directory: editor
        run: bun run lint

      - name: Type check
        working-directory: editor
        run: bun run type-check

      - name: Unit tests
        working-directory: editor
        run: bun run test

      # 构建也放进 CI：构建失败不应该拖到发版才暴露。
      - name: Build frontend
        working-directory: editor
        run: bun run build

  # 编辑器后端要在 Linux 上单独验一次: 它需要 Tauri 系统依赖与前端产物
  editor-native:
    name: Editor backend (clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Create placeholder frontend dist
        run: |
          mkdir -p editor/dist
          printf '<!doctype html><html><body></body></html>' > editor/dist/index.html

      - name: Clippy
        run: cargo clippy -p webgal-ink -- --deny warnings

  # C++ 渲染器: 只构建 + CPU 测试; GPU 测试留给 self-hosted.
  video-export-cpp:
    name: Video export (C++ / Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VCPKG_FORCE_SYSTEM_BINARIES: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # windows-latest 镜像不再预装 Vulkan SDK；缺失时由 action 用 Chocolatey 安装
      # 并导出 VULKAN_SDK / PATH（CMake 需要 vulkan-1.lib 与 glslc）。
      - uses: ./.github/actions/setup-vulkan

      # vcpkg.json 带 builtin-baseline; action 负责在镜像的 vcpkg 里解析/拉取它,
      # 缓存 key 再把 baseline 与 manifest 哈希一起算进去。
      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.baseline }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.baseline }}-
            vcpkg-${{ runner.os }}-

      # LLVM 装在 Program Files\LLVM，clang-format/clang-tidy 及依赖的 DLL 都在 bin 里。
      # 只缓存 bin：命中且版本够新时跳过下面的 choco 安装，避免每次 job 重下 ~600 MB。
      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: 'C:\Program Files\LLVM\bin'
          key: llvm-${{ runner.os }}-23.1.3

      # windows-latest 预装的是 LLVM 20，而 VS 18 的 MSVC 14.52 STL 要求 Clang 22+
      # (yvals_core.h 的 STL1000 断言会把 clang-tidy 直接判成 clang-diagnostic-error)。
      # 版本不够时安装固定版本；clang-format 与 clang-tidy 由同一份 LLVM 提供。
      - name: Ensure LLVM (clang-tidy 22+)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $required = 22
          $tidy = Join-Path $env:ProgramFiles 'LLVM\bin\clang-tidy.exe'

          function Get-ClangMajor([string] $path) {
            if (-not (Test-Path $path)) { return 0 }
            # `clang-tidy --version` 第一行是 "LLVM (http://llvm.org/):",
            # 版本在第二行 "LLVM version 23.1.3", 所以要对整段输出匹配。
            $output = (& $path --version) -join "`n"
            if ($output -match 'LLVM version (\d+)') { return [int] $Matches[1] }
            Write-Host "无法解析 clang-tidy 版本输出: $output"
            return 0
          }

          $major = Get-ClangMajor $tidy
          if ($major -lt $required) {
            Write-Host "clang-tidy major=$major 低于 MSVC STL 要求的 $required，安装 LLVM 23.1.3"
            # 镜像里的 LLVM 可能是镜像自带的（choco 不认），--force 跳过“已安装”判断，
            # 直接让 MSI 做升级/覆盖安装。
            choco install llvm --version=23.1.3 --no-progress -y --force
            if ($LASTEXITCODE -ne 0) { throw "choco install llvm 失败 (exit $LASTEXITCODE)" }
            $major = Get-ClangMajor $tidy
          }
          if ($major -lt $required) {
            throw "clang-tidy 不可用或版本仍低于 $required (major=$major)"
          }
          Write-Host "clang-tidy major: $major"

      - name: Configure
        run: cmake --preset windows-msvc-ci

      - name: Format check
        run: cmake --build --preset windows-msvc-ci --target format-check

      - name: Build
        run: cmake --build --preset windows-msvc-ci

      - name: Tidy
        run: cmake --build --preset windows-msvc-ci --target tidy

      - name: Test
        run: ctest --preset windows-msvc-ci

  # Rust 侧真正链接 C++ 渲染器: build.rs 找 CMake/vcpkg/Vulkan SDK, 静态链接,
  # 并给最终二进制加 vulkan-1.dll 的延迟加载声明。C++ job 只编 C++ (不链 Rust),
  # Linux 的 editor-native 走 stub, 两条都覆盖不到这里。
  video-export-rust:
    name: Video export (Rust link, Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_FORCE_SYSTEM_BINARIES: 1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 链接需要 vulkan-1.lib；镜像不再预装时由 action 安装。
      - uses: ./.github/actions/setup-vulkan

      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-rust-${{ runner.os }}-${{ steps.vcpkg.outputs.baseline }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-rust-${{ runner.os }}-${{ steps.vcpkg.outputs.baseline }}-

      # webgal-ink 的 build.rs 需要前端产物; 占位文件即可, 不跑 bun。
      - name: Create placeholder frontend dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path editor/dist | Out-Null
          Set-Content -Path editor/dist/index.html -Value '<!doctype html><html><body></body></html>'

      - name: Test video export crates
        run: cargo test -p webgal-video-export -p webgal-video-render-sys

      - name: Clippy
        run: cargo clippy -p webgal-video-export -p webgal-video-render-sys --all-targets -- --deny warnings

      # 只有真正链接出 webgal-ink.exe 才能验证 src-tauri/build.rs 的延迟加载声明。
      - name: Build editor backend
        run: cargo build -p webgal-ink

  # Playground 是唯一需要 wasm 的 TS 模块, 所以单独一个 job, 不拖累其它检查
  playground:
    name: Parse playground (wasm + build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # 预编译二进制, 别再用 cargo install 现编一个 wasm-pack
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build wasm package
        working-directory: packages/webgal-parse-playground
        run: bun run build:wasm

      # 必须在 build:wasm 之后: 该包以 file: 依赖 crates/webgal-language-service/pkg
      - name: Install dependencies
        working-directory: packages/webgal-parse-playground
        run: bun install --frozen-lockfile

      - name: Check formatting
        working-directory: packages/webgal-parse-playground
        run: bun run format-check

      - name: Lint
        working-directory: packages/webgal-parse-playground
        run: bun run lint

      - name: Type check
        working-directory: packages/webgal-parse-playground
        run: bun run type-check

      - name: Build
        working-directory: packages/webgal-parse-playground
        run: bun run build

  # Python 脚本只有静态检查与格式检查; 配置统一在根 pyproject.toml
  python:
    name: Python (pyright + black)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 版本与本地保持一致; 升级时同时改这里和 AGENTS.md 的安装命令.
      - name: Install tools
        run: python -m pip install black==26.5.1 pyright==1.1.414 types-requests==2.33.0.20261030

      - name: Check formatting
        run: python -m black --check --diff scripts crates/webgal-language-service/scripts

      - name: Type check (strict)
        run: python -m pyright
