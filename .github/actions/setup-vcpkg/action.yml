# This file is generated by AI.

# 让 runner 上的 vcpkg 能解析 `vcpkg.json` 的 builtin-baseline，并把它作为输出
# 给缓存 key 使用。
#
# manifest 模式会用 `git show <baseline>:versions/baseline.json` 取版本表；镜像里的
# vcpkg 是从某个 commit 构建的，若它比 baseline 旧就取不到。这里先检查对象是否存在，
# 不存在就按 SHA 拉取一次（GitHub 允许 fetch 可达提交）。
#
# 输出:
#   baseline: vcpkg.json 里的 builtin-baseline

name: setup-vcpkg
description: 解析 vcpkg baseline，必要时拉取对应提交

outputs:
  baseline:
    description: vcpkg.json 的 builtin-baseline
    value: ${{ steps.baseline.outputs.baseline }}

runs:
  using: composite
  steps:
    - name: Resolve vcpkg baseline
      id: baseline
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
        if (-not $baseline) { throw "vcpkg.json 缺少 builtin-baseline" }

        if ($env:VCPKG_INSTALLATION_ROOT) {
          $root = $env:VCPKG_INSTALLATION_ROOT
        } elseif (Get-Command vcpkg -ErrorAction SilentlyContinue) {
          $root = Split-Path (Get-Command vcpkg).Source -Parent
        } else {
          throw "找不到 vcpkg（VCPKG_INSTALLATION_ROOT 或 PATH）"
        }

        git -C $root cat-file -e "$baseline^{commit}" 2>$null
        if ($LASTEXITCODE -ne 0) {
          Write-Host "vcpkg ($root) 里没有 baseline $baseline，按 SHA 拉取一次"
          git -C $root fetch --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) {
            throw "无法解析 vcpkg baseline $baseline：请确认 runner 的 vcpkg 是 git 克隆，或把 baseline 换成镜像里已有的提交"
          }
        }

        Write-Host "vcpkg baseline: $baseline"
        "baseline=$baseline" >> $env:GITHUB_OUTPUT
