# This file is generated by AI.

# 确保存在可用的 Vulkan SDK，并把 VULKAN_SDK / PATH 传给后续步骤。
#
# 为什么需要它：GitHub 的 windows-latest 镜像不再预装 Vulkan SDK
# （actions/runner-images 的 Windows 工具清单里没有 Vulkan），而编译 C++ 渲染器需要
# `Lib\vulkan-1.lib`、`Bin\glslc.exe` 与头文件。只做“检查并报错”会让 job 永远红，
# 所以这里在缺失时用 Chocolatey 安装（约 300 MB，安装到 C:\VulkanSDK\<版本>）。
#
# 安装器是 Qt Installer Framework，静默参数由 chocolatey 的 vulkan-sdk 包提供。
# 安装目录固定为 C:\VulkanSDK\<version>；本 action 同时兼容镜像以后重新预装的情况。

name: setup-vulkan
description: 定位或安装 Vulkan SDK，导出 VULKAN_SDK 与 PATH

runs:
  using: composite
  steps:
    - name: Locate or install Vulkan SDK
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        function Find-VulkanSdk {
          $candidates = @()
          if ($env:VULKAN_SDK) { $candidates += $env:VULKAN_SDK }
          foreach ($root in @('C:\VulkanSDK', "$env:ProgramFiles\VulkanSDK")) {
            if (Test-Path $root) {
              $candidates += Get-ChildItem $root -Directory |
                Sort-Object Name -Descending |
                ForEach-Object { $_.FullName }
            }
          }
          foreach ($candidate in $candidates) {
            if ((Test-Path "$candidate\Lib\vulkan-1.lib") -and
                (Test-Path "$candidate\Bin\glslc.exe")) {
              return $candidate
            }
          }
          return $null
        }

        $sdk = Find-VulkanSdk
        if (-not $sdk) {
          Write-Host "未找到可用的 Vulkan SDK，使用 Chocolatey 安装 vulkan-sdk"
          choco install vulkan-sdk --no-progress -y
          if ($LASTEXITCODE -ne 0) {
            throw "choco install vulkan-sdk 失败 (exit $LASTEXITCODE)"
          }
          $sdk = Find-VulkanSdk
        }
        if (-not $sdk) {
          throw "找不到 Vulkan SDK: 需要同时包含 Lib\vulkan-1.lib 与 Bin\glslc.exe 的目录"
        }

        Write-Host "Vulkan SDK: $sdk"
        "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
        "$sdk\Bin" >> $env:GITHUB_PATH
